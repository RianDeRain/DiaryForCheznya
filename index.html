<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Little Diary 🌷</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe5ef, #f5e7ff, #e3f4ff);
      color: #5c4b56;
      padding: 30px 15px;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 38px;
      color: #d66d9b;
      margin-bottom: 8px;
    }

    header p {
      color: #8d7a85;
    }

    .card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(170, 120, 150, 0.15);
    }

    label {
      display: block;
      margin: 12px 0 7px;
      font-weight: bold;
      color: #795d6b;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 2px solid #f3d4e1;
      border-radius: 15px;
      padding: 13px;
      outline: none;
      background: #fffafd;
      color: #5c4b56;
      font-size: 14px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #e89abc;
    }

    button {
      border: none;
      border-radius: 15px;
      padding: 13px 22px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .save-btn {
      width: 100%;
      margin-top: 18px;
      background: #e88fb3;
      color: white;
      font-size: 15px;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.03);
    }

    .diary-title {
      color: #d66d9b;
      margin-bottom: 15px;
    }

    .entry {
      background: #fff8fc;
      border: 1px solid #f4dce7;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
      animation: appear 0.3s ease;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .entry-date {
      font-size: 13px;
      color: #a38b97;
    }

    .entry-mood {
      background: #ffe1ed;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 13px;
    }

    .entry h3 {
      margin-bottom: 8px;
      color: #765666;
    }

    .entry p {
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .delete-btn {
      background: #ffd9df;
      color: #b55769;
      padding: 7px 12px;
      font-size: 12px;
      margin-top: 12px;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #a58e99;
    }

    footer {
      text-align: center;
      color: #a38b97;
      font-size: 13px;
      margin-top: 25px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .heart {
      position: fixed;
      pointer-events: none;
      animation: float 3s linear forwards;
      font-size: 20px;
      z-index: 999;
    }

    @keyframes float {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      100% {
        opacity: 0;
        transform: translateY(-150px) scale(1.5);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>🌷 My Little Diary</h1>
      <p>Tempat kecil untuk menyimpan cerita, perasaan, dan kenangan.</p>
    </header>

    <div class="card">
      <h2 class="diary-title">✍️ Tulis Cerita</h2>

      <label for="date">Tanggal</label>
      <input type="date" id="date">

      <label for="mood">Mood hari ini</label>
      <select id="mood">
        <option value="😊 Bahagia">😊 Bahagia</option>
        <option value="🥰 Senang">🥰 Senang</option>
        <option value="😌 Tenang">😌 Tenang</option>
        <option value="😔 Sedih">😔 Sedih</option>
        <option value="😡 Kesal">😡 Kesal</option>
        <option value="😭 Capek">😭 Capek</option>
        <option value="🤩 Excited">🤩 Excited</option>
      </select>

      <label for="title">Judul</label>
      <input
        type="text"
        id="title"
        placeholder="Hari ini tentang..."
      >

      <label for="content">Ceritamu</label>
      <textarea
        id="content"
        placeholder="Tulis apa pun yang kamu rasakan hari ini... 💭"
      ></textarea>

      <button class="save-btn" onclick="saveDiary()">
        💗 Simpan Diary
      </button>
    </div>

    <div class="card">
      <h2 class="diary-title">📖 Diary-ku</h2>
      <div id="diaryList"></div>
    </div>

    <footer>
      Made with 💗 for little moments that matter.
    </footer>

  </div>

  <script>
    const dateInput = document.getElementById("date");
    const titleInput = document.getElementById("title");
    const contentInput = document.getElementById("content");
    const moodInput = document.getElementById("mood");
    const diaryList = document.getElementById("diaryList");

    // Set tanggal hari ini
    const today = new Date().toISOString().split("T")[0];
    dateInput.value = today;

    // Ambil diary dari localStorage
    let diaries = JSON.parse(localStorage.getItem("myDiaries")) || [];

    function saveDiary() {
      const date = dateInput.value;
      const title = titleInput.value.trim();
      const content = contentInput.value.trim();
      const mood = moodInput.value;

      if (!title || !content) {
        alert("Judul dan isi diary belum diisi ya 🌷");
        return;
      }

      const diary = {
        id: Date.now(),
        date,
        title,
        content,
        mood
      };

      diaries.unshift(diary);

      localStorage.setItem("myDiaries", JSON.stringify(diaries));

      titleInput.value = "";
      contentInput.value = "";

      showHeart();
      renderDiaries();
    }

    function deleteDiary(id) {
      if (confirm("Hapus diary ini? 🥺")) {
        diaries = diaries.filter(diary => diary.id !== id);

        localStorage.setItem(
          "myDiaries",
          JSON.stringify(diaries)
        );

        renderDiaries();
      }
    }

    function renderDiaries() {
      diaryList.innerHTML = "";

      if (diaries.length === 0) {
        diaryList.innerHTML = `
          <div class="empty">
            Belum ada cerita di sini... 🌸<br>
            Yuk tulis diary pertamamu!
          </div>
        `;
        return;
      }

      diaries.forEach(diary => {
        const entry = document.createElement("div");
        entry.className = "entry";

        entry.innerHTML = `
          <div class="entry-header">
            <span class="entry-date">
              📅 ${formatDate(diary.date)}
            </span>

            <span class="entry-mood">
              ${diary.mood}
            </span>
          </div>

          <h3>${escapeHTML(diary.title)}</h3>

          <p>${escapeHTML(diary.content)}</p>

          <button
            class="delete-btn"
            onclick="deleteDiary(${diary.id})"
          >
            🗑️ Hapus
          </button>
        `;

        diaryList.appendChild(entry);
      });
    }

    function formatDate(date) {
      if (!date) return "";

      const options = {
        day: "numeric",
        month: "long",
        year: "numeric"
      };

      return new Date(date + "T00:00:00")
        .toLocaleDateString("id-ID", options);
    }

    // Mencegah HTML injection dari isi diary
    function escapeHTML(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showHeart() {
      for (let i = 0; i < 8; i++) {
        const heart = document.createElement("div");

        heart.className = "heart";
        heart.textContent = ["💗", "🌸", "💕", "✨"][Math.floor(Math.random() * 4)];

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = "80vh";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 3000);
      }
    }

    renderDiaries();
  </script>

</body>
</html>
